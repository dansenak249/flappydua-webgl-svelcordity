<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="https://sdk.discordactivities.com/sdk.js"></script>
		<script>
			if (typeof window.initializeDiscordSdk !== "function") {
				console.warn("Discord SDK not detected. Running in fallback mode.");
				window.initializeDiscordSdk = async () => {
					return {
						ready: async () => {},
						commands: {
							getUser: async () => ({ id: "0", username: "Guest" })
						}
					};
				};
			}
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
